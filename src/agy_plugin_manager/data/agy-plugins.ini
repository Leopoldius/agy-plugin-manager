[general]
config=auto
plugins_dir=auto
backup_dir=auto
default_profile=clean
backup=true
verbosity=1

[profile.clean]
android-cli-plugin=off
chrome-devtools-plugin=off
data-agent-kit-plugin=off
firebase=off
flutter=off
gemini-api=off
google-antigravity-sdk=off
google_maps_platform=off
modern-web-guidance-plugin=off
science=off

[profile.full]
android-cli-plugin=on
chrome-devtools-plugin=on
data-agent-kit-plugin=on
firebase=on
flutter=on
gemini-api=on
google-antigravity-sdk=on
google_maps_platform=on
modern-web-guidance-plugin=on
science=on

[profile.coding]
android-cli-plugin=off
chrome-devtools-plugin=off
data-agent-kit-plugin=off
firebase=off
flutter=off
gemini-api=off
google-antigravity-sdk=keep
google_maps_platform=off
modern-web-guidance-plugin=off
science=off
